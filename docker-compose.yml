services:
  # 1. Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: prisma_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prisma1234
      POSTGRES_DB: prisma_hotel
    volumes:
      # Datos persistentes de la base
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta SOLO la primera vez que se crea la base
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prisma_hotel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend (Express)
  backend:
    build: ./BACKEND_PRISMA
    container_name: prisma_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: prisma1234
      DB_NAME: prisma_hotel
      JWT_SECRET: cambia_este_secreto_en_produccion
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      # Codigo en vivo: lo que edites en tu PC se refleja en el contenedor
      - ./BACKEND_PRISMA:/app
      # Evita que la carpeta node_modules de tu PC pise la del contenedor
      - /app/node_modules

  # 3. Frontend (React + Vite)
  frontend:
    build: ./FRONTEND_PRISMA
    container_name: prisma_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./FRONTEND_PRISMA:/app
      - /app/node_modules

volumes:
  pgdata:
